<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>接口解说员</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px; color: #1f2733; background: #f6f7fb;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; background: linear-gradient(135deg, #10b981, #22d3ee); color: #fff;
    }
    .header__title { font-size: 14px; font-weight: 600; }
    .header__count { font-size: 11px; opacity: 0.9; }
    .icon-btn {
      border: none; background: rgba(255,255,255,0.18); color: #fff;
      width: 26px; height: 26px; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.32); }
    .list { max-height: 260px; overflow-y: auto; background: #fff; }
    .empty { padding: 24px 14px; text-align: center; color: #98a1ad; }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid #f0f1f5; font-size: 12px;
    }
    .row__method {
      flex-shrink: 0; width: 46px; text-align: center; padding: 2px 0;
      border-radius: 5px; font-size: 10px; font-weight: 700; color: #fff;
    }
    .m-get { background: #10b981; }
    .m-post { background: #3b82f6; }
    .m-put, .m-patch { background: #f59e0b; }
    .m-delete { background: #ef4444; }
    .m-other { background: #64748b; }
    .row__path {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    }
    .row__meta { flex-shrink: 0; color: #98a1ad; font-size: 11px; }
    .row__meta .err { color: #ef4444; font-weight: 600; }
    .result {
      margin: 10px 12px; padding: 10px 12px; background: #fff; border: 1px solid #e5e7ef;
      border-radius: 10px; line-height: 1.7; max-height: 260px; overflow-y: auto;
    }
    .result h3 { margin: 8px 0 4px; font-size: 13px; color: #0d9488; }
    .result p { margin: 4px 0; }
    .result ul { margin: 4px 0; padding-left: 18px; }
    .result li { margin: 3px 0; }
    .result strong { color: #0d9488; }
    .result code {
      padding: 1px 4px; background: #ecfdf5; border-radius: 4px;
      font-size: 11px; font-family: ui-monospace, Menlo, monospace;
    }
    .error {
      margin: 10px 12px; padding: 8px 10px; background: #fdf0f0;
      border: 1px solid #f5c6c6; border-radius: 8px; color: #b03a3a; word-break: break-all;
    }
    .footer {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 10px 12px; border-top: 1px solid #eceef3;
    }
    .btn {
      padding: 6px 14px; border: 1px solid #d6dbe3; border-radius: 8px;
      background: #fff; font-size: 12px; cursor: pointer; color: #1f2733;
    }
    .btn:hover { border-color: #10b981; color: #10b981; }
    .btn--primary { background: #10b981; border-color: #10b981; color: #fff; }
    .btn--primary:hover { background: #0d9668; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header__title">接口解说员</div>
      <div id="countText" class="header__count"></div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
  </div>

  <div id="list" class="list"></div>
  <div id="errorBox" class="error" hidden></div>
  <article id="result" class="result" hidden></article>

  <div class="footer">
    <button id="clearBtn" class="btn">清空记录</button>
    <button id="explainBtn" class="btn btn--primary">AI 解说</button>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
