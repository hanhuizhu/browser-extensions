<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>暗黑皮肤 - 排除列表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px; color: #1f2733; background: #fff;
    }
    h1 { font-size: 16px; margin-bottom: 6px; }
    .desc { color: #98a1ad; font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
    .desc code { background: #f0f1f6; padding: 1px 5px; border-radius: 4px; }
    textarea {
      width: 100%; height: 180px; padding: 10px; resize: vertical;
      border: 1px solid #d6dbe3; border-radius: 8px; outline: none;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.8;
    }
    textarea:focus { border-color: #6366f1; }
    .save-btn {
      margin-top: 12px; padding: 8px 20px; border: none; border-radius: 8px;
      background: #6366f1; color: #fff; font-size: 13px; cursor: pointer;
    }
    .save-btn:hover { background: #4f52d9; }
    .save-tip { display: inline-block; margin-left: 10px; color: #2f9e5f; }
  </style>
</head>
<body>
  <h1>排除列表</h1>
  <p class="desc">
    一行一个 URL 匹配模式，命中的页面不套暗黑皮肤。支持 <code>*</code> 通配符：<br />
    <code>*tuhu*</code> 匹配 URL 中含 tuhu 的所有站点；不写 <code>*</code> 时按子串匹配。
  </p>
  <textarea id="patterns" placeholder="*tuhu*&#10;*figma.com*&#10;localhost"></textarea>
  <br />
  <button id="saveBtn" class="save-btn">保存</button>
  <span id="saveTip" class="save-tip" hidden>已保存 ✓（已打开的页面即时生效）</span>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
