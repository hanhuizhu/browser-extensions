<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 阅读助手 - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 420px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: #1f2733;
      background: #fff;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 16px;
    }

    .form-item {
      margin-bottom: 14px;
    }

    .form-item label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-item input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d6dbe3;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .form-item input:focus {
      border-color: #5b5ef4;
    }

    .form-item .hint {
      margin-top: 4px;
      font-size: 11px;
      color: #98a1ad;
      line-height: 1.5;
    }

    .form-item .hint a {
      color: #5b5ef4;
    }

    .save-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: #5b5ef4;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #4548c9;
    }

    .save-tip {
      display: inline-block;
      margin-left: 10px;
      color: #2f9e5f;
    }
  </style>
</head>
<body>
  <h1>AI 阅读助手设置</h1>

  <div class="form-item">
    <label for="apiKey">DeepSeek API Key</label>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
    <p class="hint">
      在 <a href="https://platform.deepseek.com/api_keys" target="_blank">DeepSeek 开放平台</a>
      创建。Key 仅保存在本机浏览器（chrome.storage.local），只用于直连 DeepSeek API。
    </p>
  </div>

  <div class="form-item">
    <label for="model">模型名称</label>
    <input type="text" id="model" placeholder="deepseek-v4-flash-vision-exp" />
    <p class="hint">留空则使用默认模型 deepseek-v4-flash-vision-exp</p>
  </div>

  <button id="saveBtn" class="save-btn">保存</button>
  <span id="saveTip" class="save-tip" hidden>已保存 ✓</span>

  <script src="constants.js"></script>
  <script src="options.js"></script>
</body>
</html>
